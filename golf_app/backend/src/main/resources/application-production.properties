# Production Configuration for Golf Application Database Optimization
# Created: 2025-07-05
# Purpose: Optimized production settings for high-performance golf analytics

spring.application.name=golf-analytics-app

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/golfdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Production Optimized)
spring.datasource.hikari.pool-name=GolfAppProductionPool
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# Advanced HikariCP Configuration
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=300
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false
spring.datasource.hikari.data-source-properties.defaultRowFetchSize=50
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# =============================================================================
# JPA/HIBERNATE CONFIGURATION
# =============================================================================

# Basic JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Query Optimization
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=512
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=256

# Caching Configuration
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.cache.default_cache_concurrency_strategy=read_write

# Golf App Specific Optimizations
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.max_fetch_depth=3
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.properties.hibernate.collection.default_batch_size=50

# Statistics and Monitoring
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000

# PostgreSQL Specific
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================================================
# TRANSACTION MANAGEMENT
# =============================================================================

spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# =============================================================================
# CACHING CONFIGURATION
# =============================================================================

# Spring Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# Cache Names for Golf App
spring.cache.cache-names=sessionSummary,sessionStats,sessionAnalytics,clubStatistics,globalStats

# =============================================================================
# DATA ARCHIVING CONFIGURATION
# =============================================================================

# Archiving Settings
golf.archiving.enabled=true
golf.archiving.retention.sessions.months=24
golf.archiving.retention.shots.months=36
golf.archiving.batch.size=500
golf.archiving.create.archive.tables=true

# =============================================================================
# PERFORMANCE MONITORING
# =============================================================================

# Actuator for monitoring
management.endpoints.web.exposure.include=health,metrics,info,prometheus,hikaricp
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Custom metrics
management.metrics.enable.hikaricp=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================

# Root logging level
logging.level.root=INFO

# Application logging
logging.level.com.example.demo=INFO
logging.level.com.example.demo.service.DatabaseMonitoringService=DEBUG

# Database logging (minimal in production)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=INFO

# Performance logging
logging.level.org.hibernate.stat=INFO
logging.level.org.springframework.cache=INFO

# =============================================================================
# FILE UPLOAD CONFIGURATION
# =============================================================================

# Large CSV file support
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =============================================================================
# ASYNC PROCESSING
# =============================================================================

# Async task execution
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=golf-app-async-

# Scheduling
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=golf-app-scheduler-

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# Basic security for production
spring.security.user.name=admin
spring.security.user.password=${GOLF_APP_ADMIN_PASSWORD:changeme}
spring.security.user.roles=ADMIN

# =============================================================================
# COMPRESSION AND OPTIMIZATION
# =============================================================================

# HTTP compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# =============================================================================
# CUSTOM GOLF APP PROPERTIES
# =============================================================================

# Analytics Configuration
golf.analytics.cache.duration=300
golf.analytics.max.sessions.comparison=10
golf.analytics.batch.processing.size=1000

# Performance Thresholds
golf.performance.slow.query.threshold=1000
golf.performance.connection.warning.threshold=80
golf.performance.memory.warning.threshold=85

# Data Quality
golf.data.validation.enabled=true
golf.data.outlier.detection.enabled=true
golf.data.outlier.zscore.threshold=2.5