global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot backend metrics
  - job_name: "golf-backend"
    static_configs:
      - targets: ["backend:8080"]
    metrics_path: "/actuator/prometheus"
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL metrics (if using postgres_exporter)
  - job_name: "postgres"
    static_configs:
      - targets: ["db:5432"]
    # Note: You would need to add postgres_exporter to collect DB metrics
    # metrics_path: "/metrics"
    # scrape_interval: 30s

  # Redis metrics (if using redis_exporter)
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    # Note: You would need to add redis_exporter to collect Redis metrics
    # metrics_path: "/metrics"
    # scrape_interval: 30s

  # Node exporter for system metrics (if added)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093